# nginx-Block für die Jane-Hirsch-Website (Reverse-Proxy auf den lokalen Node-Dienst, Port 3110).
# Einbinden NUR nach Absprache:
#   - Staging:  server_name = Staging-Subdomain (neuer DNS-Eintrag nötig)
#   - Livegang: server_name = jane-hirsch.de www.jane-hirsch.de  (erst nach ausdrücklicher Freigabe + DNS-Umstellung)
#
# Installation (ändert bestehende Seiten nicht):
#   sudo cp nginx-jane-hirsch.conf /etc/nginx/sites-available/jane-hirsch
#   sudo nano /etc/nginx/sites-available/jane-hirsch     # server_name anpassen
#   sudo ln -s /etc/nginx/sites-available/jane-hirsch /etc/nginx/sites-enabled/jane-hirsch
#   sudo nginx -t && sudo systemctl reload nginx          # erst reload, wenn "syntax is ok"
#   sudo certbot --nginx -d <server_name>                 # HTTPS-Zertifikat (Domain muss auf den VPS zeigen)
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.invalid;   # <-- anpassen

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Wichtig: überschreibt vom Client gesendete Werte (Rate-Limit liest die erste IP, TRUST_PROXY=true)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
